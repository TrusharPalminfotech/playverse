name: iOS CI Build & Upload TestFlight

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-latest

    env:
      FLUTTER_VERSION: "3.41.7"
      CERTIFICATE_PATH: /tmp/certificate.p12
      PROFILE_PATH: /tmp/profile.mobileprovision
      KEYCHAIN_PATH: /tmp/app-signing.keychain-db
      KEYCHAIN_PASSWORD: temp123

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      ####################################################
      # Signing Assets
      ####################################################

      - name: Decode Distribution Certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
        run: |
          printf "%s" "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

      - name: Decode Provisioning Profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          printf "%s" "$PROFILE" | base64 --decode > "$PROFILE_PATH"

      ####################################################
      # Keychain
      ####################################################

      - name: Create Temporary Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Import Distribution Certificate
        run: |
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12

      - name: Verify Certificate
        run: |
          security find-identity -v -p codesigning

      ####################################################
      # Provisioning Profile
      ####################################################

      - name: Install Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(security cms -D -i "$PROFILE_PATH" | \
          /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)

          cp "$PROFILE_PATH" \
          "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Verify Provisioning Profile
        run: |
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist

      ####################################################
      # Build
      ####################################################

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-method app-store

      ####################################################
      # Verify IPA
      ####################################################

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)

          if [ -z "$IPA" ]; then
            echo "No IPA generated."
            exit 1
          fi

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      ####################################################
      # Upload Artifact
      ####################################################

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.ipa.outputs.ipa }}

      ####################################################
      # App Store Connect API
      ####################################################

      - name: Create API Key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          printf "%s" "$APPSTORE_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      ####################################################
      # Upload TestFlight
      ####################################################

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "${{ steps.ipa.outputs.ipa }}" \
            -apiKey "$KEY_ID" \
            -apiIssuer "$ISSUER_ID"