name: iOS CI Build & Upload TestFlight

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-latest

    env:
      FLUTTER_VERSION: "3.41.7"
      CERTIFICATE_PATH: /tmp/certificate.p12
      PROFILE_PATH: /tmp/profile.mobileprovision
      KEYCHAIN_PATH: /tmp/app-signing.keychain-db
      KEYCHAIN_PASSWORD: temp123

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Project
        run: flutter analyze

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # --------------------------------------------------
      # Decode Signing Assets
      # --------------------------------------------------

      - name: Decode Distribution Certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
        run: |
          printf "%s" "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Certificate Size:"
          ls -lh "$CERTIFICATE_PATH"

      - name: Decode Provisioning Profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          printf "%s" "$PROFILE" | base64 --decode > "$PROFILE_PATH"

          echo "Provisioning Profile Size:"
          ls -lh "$PROFILE_PATH"

          file "$PROFILE_PATH"

      # --------------------------------------------------
      # Keychain
      # --------------------------------------------------

      - name: Create Temporary Keychain
        run: |
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      - name: Import Distribution Certificate
        run: |
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Verify Certificate
        run: |
          security find-identity -v -p codesigning

      # --------------------------------------------------
      # Provisioning Profile
      # --------------------------------------------------

      - name: Verify Provisioning Profile
        run: |
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist

          echo "Profile Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            /tmp/profile.plist

          echo "UUID:"
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            /tmp/profile.plist

      - name: Install Provisioning Profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            /tmp/profile.plist
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Installed Profile UUID: $UUID"

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-method app-store

      # --------------------------------------------------
      # Locate IPA
      # --------------------------------------------------

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)

          if [ -z "$IPA" ]; then
            echo "IPA not found!"
            exit 1
          fi

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

          echo "Found IPA:"
          echo "$IPA"

      # --------------------------------------------------
      # Upload Artifact
      # --------------------------------------------------

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.ipa.outputs.ipa }}
          if-no-files-found: error

      # --------------------------------------------------
      # App Store Connect API Key
      # --------------------------------------------------

      - name: Create App Store Connect API Key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          printf "%s" "$APPSTORE_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      # --------------------------------------------------
      # Upload to TestFlight
      # --------------------------------------------------

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "${{ steps.ipa.outputs.ipa }}" \
            -apiKey "$KEY_ID" \
            -apiIssuer "$ISSUER_ID"