# Production-ready GitHub Actions workflow for Flutter iOS -> TestFlight
name: iOS CI Build & Upload TestFlight

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    env:
      FLUTTER_VERSION: "3.41.7"
      CERTIFICATE_PATH: /tmp/certificate.p12
      PROFILE_PATH: /tmp/profile.mobileprovision
      KEYCHAIN_PATH: /tmp/app-signing.keychain-db
      KEYCHAIN_PASSWORD: temp123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - run: flutter clean
      - run: flutter pub get
      - run: flutter analyze

      - name: Build Information
        run: |
          grep "^version:" pubspec.yaml
          echo "Run Number: ${{ github.run_number }}"
          git rev-parse --short HEAD

      - run: |
          cd ios
          pod install

      - name: Decode Distribution Certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
        run: printf "%s" "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

      - name: Decode Provisioning Profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: printf "%s" "$PROFILE" | base64 --decode > "$PROFILE_PATH"

      - name: Create Keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Import Certificate
        run: |
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        run: |
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Verify Build
        run: |
          APP=$(find build/ios/archive -name Runner.app | head -1)
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist"

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(find build -name "*.ipa" | head -1)
          test -n "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.ipa.outputs.ipa }}

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Cleanup
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
