name: iOS CI Build & Upload TestFlight

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    env:
      CERTIFICATE_PATH: /tmp/certificate.p12
      PP_PATH: /tmp/profile.mobileprovision
      KEYCHAIN_PATH: /tmp/app-signing.keychain-db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      # Decode Distribution Certificate
      - name: Decode Distribution Certificate
        run: |
          echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}" | base64 --decode > "$CERTIFICATE_PATH"

      # Decode Provisioning Profile
      - name: Decode Provisioning Profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > "$PP_PATH"

      # Create Temporary Keychain
      - name: Create Keychain
        run: |
          security create-keychain -p "temp123" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp123" "$KEYCHAIN_PATH"

      # Import Certificate
      - name: Import Certificate
        run: |
          security import "$CERTIFICATE_PATH" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      # Install Provisioning Profile
      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")

          cp "$PP_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # Build IPA
      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-method app-store

      # Find IPA
      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA Found: $IPA_PATH"

      # Upload IPA Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.ipa_path }}

      # Create App Store Connect API Key
      - name: Create API Key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      # Upload to TestFlight
      - name: Upload to TestFlight
        run: |
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "${{ steps.ipa.outputs.ipa_path }}" \
            -apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            -apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"